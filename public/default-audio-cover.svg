<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#282a30" />
      <stop offset="60%" stop-color="#18191d" />
      <stop offset="100%" stop-color="#0f1012" />
    </radialGradient>
    <linearGradient id="noteGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1d5db" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="32" fill="url(#bgGradient)" />

  <!-- Outer Concentric Ripple -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.05" />

  <!-- Mid Concentric Ripple -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.08" />

  <!-- Inner Soft Aura -->
  <circle cx="256" cy="256" r="85" fill="#ffffff" fill-opacity="0.02" />

  <!-- Music Note Vector -->
  <g transform="translate(196, 176)">
    <!-- Connecting Beam Bar -->
    <path
      d="M20 28 L100 12"
      stroke="url(#noteGradient)"
      stroke-width="18"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Left Stem & Left Note Head -->
    <path
      d="M20 28 V110 C20 128 5 138 -12 138 C-28 138 -38 126 -38 110 C-38 94 -24 82 -6 82 C8 82 20 90 20 102"
      stroke="url(#noteGradient)"
      stroke-width="18"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <!-- Right Stem & Right Note Head -->
    <path
      d="M100 12 V94 C100 112 85 122 68 122 C52 122 42 110 42 94 C42 78 56 66 74 66 C88 66 100 74 100 86"
      stroke="url(#noteGradient)"
      stroke-width="18"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
  </g>

  <!-- Clean Minimalist Audio Label -->
  <text
    x="256"
    y="442"
    text-anchor="middle"
    fill="#9ca3af"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="13"
    font-weight="700"
    letter-spacing="4"
    fill-opacity="0.75"
  >AIRSHARE PRO</text>
</svg>
